# Machine-readable licence map (REUSE Specification 3.3).
#
# Most of this repository is binary — STL, STEP, PDF, PNG, JPG, GIF — and cannot
# carry an SPDX header. This file assigns copyright and licence by path instead.
#
# ORDERING MATTERS: the LAST matching [[annotations]] block wins. Blocks are
# therefore ordered general -> specific. Verify with `reuse spdx` after editing;
# in particular check the eight meshes under
# community/histology-slide-gripper/mujoco/meshes/arm/.
#
# Human-readable version of the same map: see LICENSING.md.
#
# The three licence texts exist twice on purpose: LICENSES/ is where the REUSE
# Specification requires them, and HARDWARE-LICENSE.txt / SOFTWARE-LICENSE.txt /
# DOCS-LICENSE.txt at the root are what GitHub's licence detection reads.

version = 1
SPDX-PackageName = "SO-ARM100/101 Parallel Gripper"
SPDX-PackageSupplier = "Robonine <https://robonine.com>"
SPDX-PackageDownloadLocation = "https://github.com/roboninecom/SO-ARM100-101-Parallel-Gripper"


# ---------------------------------------------------------------------------
# 1. Catch-all: documentation, images and anything not matched below.
# ---------------------------------------------------------------------------
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "Copyright (c) 2025 Robonine"
SPDX-License-Identifier = "CC-BY-4.0"


# ---------------------------------------------------------------------------
# 2. Community variant: authored by Michael Viacheslavov, not Robonine.
#    Docs and images default to CC-BY-4.0; code and CAD are narrowed below.
# ---------------------------------------------------------------------------
[[annotations]]
path = "community/histology-slide-gripper/**"
SPDX-FileCopyrightText = "Copyright (c) 2026 Michael Viacheslavov"
SPDX-License-Identifier = "CC-BY-4.0"

# Translated community documentation retains the original contributor credit.
[[annotations]]
path = "docs/i18n/*/community/histology-slide-gripper/**"
SPDX-FileCopyrightText = [
  "Copyright (c) 2026 Michael Viacheslavov",
  "Copyright (c) 2026 Robonine",
]
SPDX-License-Identifier = "CC-BY-4.0"


# ---------------------------------------------------------------------------
# 3. Software.
# ---------------------------------------------------------------------------
[[annotations]]
path = [
  "software/**",
  "examples/**",
  ".github/**",
  ".pre-commit-config.yaml",
  ".gitignore",
  "simulation/so_arm_101_description/package.xml",
  "simulation/so_arm_101_description/setup.py",
  "simulation/so_arm_101_description/setup.cfg",
  "simulation/so_arm_101_description/Dockerfile",
  "simulation/so_arm_101_description/docker-compose.yaml",
