  "simulation/so_arm_101_description/resource/**",
  "simulation/so_arm_101_description/urdf/**",
  "simulation/so_arm_101_description/config/**",
  "simulation/so_arm_101_description/launch/**",
  "simulation/so_arm_101_description/scripts/**",
  "simulation/so_arm_101_description/test/**",
  "simulation/so_arm_101_description/docker/**",
  "simulation/so_arm_101_description/worlds/**",
  "simulation/so_arm_101_description/so_arm_101_description/**",
]
SPDX-FileCopyrightText = "Copyright (c) 2025 Robonine"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "community/histology-slide-gripper/mujoco/*.py",
  "community/histology-slide-gripper/mujoco/*.xml",
  "community/histology-slide-gripper/mujoco/*.urdf",
